<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Daily Lunch Menu — Leppävaara, Espoo</title>
<meta name="description" content="Today's lunch menus from restaurants near the office in Leppävaara, Espoo.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff4df;
    --bg-wash-a: rgba(255, 119, 89, 0.24);
    --bg-wash-b: rgba(31, 157, 122, 0.18);
    --card-bg: rgba(255, 252, 244, 0.94);
    --heading-bg: #fff9eb;
    --text: #263225;
    --muted: #716655;
    --accent: #e4572e;
    --accent-2: #1f9d7a;
    --tag-bg: #ffe7bd;
    --border: #ecd6b8;
    --shadow: rgba(118, 73, 35, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17231d;
      --bg-wash-a: rgba(255, 180, 89, 0.18);
      --bg-wash-b: rgba(69, 190, 151, 0.16);
      --card-bg: rgba(31, 42, 35, 0.94);
      --heading-bg: #26362b;
      --text: #f4efe3;
      --muted: #c7bda8;
      --accent: #ff9f5a;
      --accent-2: #5bd0ac;
      --tag-bg: #43331f;
      --border: #3f5242;
      --shadow: rgba(0, 0, 0, 0.28);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(circle at top left, var(--bg-wash-a), transparent 34rem),
      radial-gradient(circle at top right, var(--bg-wash-b), transparent 30rem),
      linear-gradient(160deg, var(--bg), var(--bg));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  h1 {
    font-size: 1.6rem;
    line-height: 1.25;
    margin: 8px 0 4px;
    color: var(--accent);
  }
  h1::before { content: none; }
  .wrap > p:first-of-type {
    font-size: 1.05rem;
    color: var(--muted);
    margin-top: 0;
  }
  .wrap > p:first-of-type strong { color: var(--text); }
  em {
    color: var(--muted);
    font-style: normal;
    font-size: 0.85rem;
    display: inline-block;
    margin-bottom: 12px;
  }
  .restaurants-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px 20px;
  }
  h2 {
    font-size: 1.15rem;
    margin: 24px 0 10px;
    padding: 12px 14px;
    background: linear-gradient(135deg, var(--heading-bg), var(--card-bg));
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: 10px;
    box-shadow: 0 10px 26px var(--shadow);
  }
  h2 a {
    color: var(--text);
    text-decoration: none;
  }
  h2 a:hover, h2 a:focus { text-decoration: underline; }
  ul {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
  }
  li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-top: none;
    padding: 10px 14px;
    font-size: 0.98rem;
    line-height: 1.45;
  }
  li::before {
    content: "–";
    color: var(--accent-2);
    font-weight: 700;
    flex-shrink: 0;
  }
  li .dish {
    flex: 1 1 auto;
    min-width: 0;
  }
  li .tags {
    flex-shrink: 0;
    white-space: nowrap;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font-size: 0.9rem;
    line-height: 1.4;
    padding: 1px 8px;
    padding-left: 8px;
    text-align: right;
  }
  li:first-of-type { border-top: 1px solid var(--border); }
  ul li:last-child { border-radius: 0 0 10px 10px; }
  footer {
    margin-top: 36px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
  @media (min-width: 860px) {
    .wrap { max-width: 1180px; }
    .restaurants-grid { grid-template-columns: 1fr 1fr; gap: 8px 24px; }
  }
  @media (max-width: 480px) {
    h1 { font-size: 1.35rem; }
    h2 { font-size: 1.05rem; padding: 10px 12px; }
    li { font-size: 0.95rem; padding: 9px 12px; }
  }
</style>
</head>
<body>
  <div class="wrap">
{{BODY}}
    <footer>Generated automatically on weekday mornings.</footer>
  </div>
</body>
</html>
