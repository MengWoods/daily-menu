<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Daily Lunch Menu — Leppävaara, Espoo</title>
<meta name="description" content="Today's lunch menus from restaurants near the office in Leppävaara, Espoo.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff4df;
    --bg-wash-a: rgba(255, 119, 89, 0.24);
    --bg-wash-b: rgba(31, 157, 122, 0.18);
    --card-bg: rgba(255, 252, 244, 0.94);
    --heading-bg: #fff9eb;
    --text: #263225;
    --muted: #716655;
    --accent: #e4572e;
    --accent-2: #1f9d7a;
    --tag-bg: #ffe7bd;
    --border: #ecd6b8;
    --shadow: rgba(118, 73, 35, 0.12);
    --chip-on-text: #ffffff;
    --bar-bg: rgba(255, 244, 223, 0.86);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17231d;
      --bg-wash-a: rgba(255, 180, 89, 0.18);
      --bg-wash-b: rgba(69, 190, 151, 0.16);
      --card-bg: rgba(31, 42, 35, 0.94);
      --heading-bg: #26362b;
      --text: #f4efe3;
      --muted: #c7bda8;
      --accent: #ff9f5a;
      --accent-2: #5bd0ac;
      --tag-bg: #43331f;
      --border: #3f5242;
      --shadow: rgba(0, 0, 0, 0.28);
      --chip-on-text: #1d1408;
      --bar-bg: rgba(23, 35, 29, 0.86);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(circle at top left, var(--bg-wash-a), transparent 34rem),
      radial-gradient(circle at top right, var(--bg-wash-b), transparent 30rem),
      linear-gradient(160deg, var(--bg), var(--bg));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  h1 {
    font-size: 1.6rem;
    line-height: 1.25;
    margin: 8px 0 4px;
    color: var(--accent);
  }
  h1::before { content: none; }
  .wrap > p:first-of-type {
    font-size: 1.05rem;
    color: var(--muted);
    margin-top: 0;
  }
  .wrap > p:first-of-type strong { color: var(--text); }
  em {
    color: var(--muted);
    font-style: normal;
    font-size: 0.85rem;
    display: inline-block;
    margin-bottom: 12px;
  }
  .restaurants-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px 20px;
  }
  h2 {
    font-size: 1.15rem;
    margin: 24px 0 10px;
    padding: 12px 14px;
    background: linear-gradient(135deg, var(--heading-bg), var(--card-bg));
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: 10px;
    box-shadow: 0 10px 26px var(--shadow);
  }
  h2 a {
    color: var(--text);
    text-decoration: none;
  }
  h2 a:hover, h2 a:focus { text-decoration: underline; }
  ul {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
  }
  li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-top: none;
    padding: 10px 14px;
    font-size: 0.98rem;
    line-height: 1.45;
  }
  li::before {
    content: "–";
    color: var(--accent-2);
    font-weight: 700;
    flex-shrink: 0;
  }
  li .dish {
    flex: 1 1 auto;
    min-width: 0;
  }
  li .tags {
    flex-shrink: 0;
    white-space: nowrap;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font-size: 0.9rem;
    line-height: 1.4;
    padding: 1px 8px;
    padding-left: 8px;
    text-align: right;
  }
  .restaurant-card > ul > li:first-of-type { border-top: 1px solid var(--border); }
  .restaurant-card > ul > li:last-child { border-radius: 0 0 10px 10px; }

  li.category-item {
    display: block;
    padding: 10px 14px 4px;
  }
  li.category-item::before { content: none; }
  .category-label {
    display: block;
    font-weight: 700;
    color: var(--accent-2);
    margin-bottom: 6px;
  }
  ul.sub-list {
    margin: 0;
    padding: 0 0 6px;
  }
  ul.sub-list li {
    border: none;
    background: transparent;
    padding: 4px 0 4px 16px;
  }
  /* ---- Diet filter bar, picks and re-sorting (driven by the script below) ---- */
  .diet-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    margin: 4px -16px 0;
    padding: 10px 16px;
    background: var(--bar-bg);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid transparent;
  }
  .diet-bar.stuck { border-bottom-color: var(--border); box-shadow: 0 8px 20px var(--shadow); }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 0.92rem;
    line-height: 1.2;
    padding: 7px 12px;
    color: var(--text);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:active { transform: scale(0.97); }
  .chip:focus-visible, .sort select:focus-visible, .pick-btn:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--chip-on-text);
    font-weight: 600;
  }
  .chip .count {
    font-size: 0.78rem;
    min-width: 1.4em;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--text);
    text-align: center;
    font-weight: 600;
  }
  .chip[aria-pressed="true"] .count { background: rgba(255, 255, 255, 0.28); color: inherit; }
  .chip.empty { opacity: 0.55; }
  .bar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px 12px;
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .sort select {
    font: inherit;
    color: var(--text);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px 6px;
    margin-left: 4px;
  }
  .picks {
    margin: 16px 0 4px;
    padding: 12px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent-2);
    border-radius: 10px;
    box-shadow: 0 10px 26px var(--shadow);
  }
  .picks h3 { margin: 0 0 8px; font-size: 1rem; color: var(--accent-2); }
  .picks ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .picks li { all: unset; display: block; }
  .picks li::before { content: none; }
  .pick-btn {
    all: unset;
    box-sizing: border-box;
    display: flex;
    gap: 8px;
    align-items: baseline;
    width: 100%;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1.4;
  }
  .pick-btn:hover { background: var(--tag-bg); }
  .pick-btn .badge { flex-shrink: 0; }
  .pick-btn .where { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .pick-btn .what { flex: 1 1 auto; min-width: 0; }
  li[data-course].dimmed, li.category-item.dimmed > .category-label { opacity: 0.35; }
  li[data-course] { transition: opacity 0.2s; }
  li.pick::before { content: "★"; color: var(--accent); }
  li.pick .dish { font-weight: 600; }
  li.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0%, 30% { background: var(--tag-bg); } 100% { background: var(--card-bg); } }
  ul.sub-list li.flash { animation-name: flash-sub; }
  @keyframes flash-sub { 0%, 30% { background: var(--tag-bg); } 100% { background: transparent; } }
  .match-note {
    display: inline-block;
    margin-left: 6px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    vertical-align: middle;
  }
  .match-note[hidden] { display: none; }
  @media (max-width: 600px) {
    .pick-btn { flex-wrap: wrap; row-gap: 0; }
    .pick-btn .what { flex-basis: calc(100% - 2.5em); }
    .pick-btn .where { flex-basis: 100%; padding-left: 2em; white-space: normal; }
  }
  .grid-divider {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 28px 0 0;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.9rem;
  }
  .grid-divider::after { content: ""; flex: 1; border-top: 1px dashed var(--border); }
  .restaurant-card.no-match h2 { opacity: 0.6; box-shadow: none; }
  /* Phone: one swipeable row of chips; once the bar sticks while scrolling,
     shrink it to icons only (the active chip keeps its label) and hide the
     status/sort row so the menus get the vertical space. */
  @media (max-width: 600px) {
    .diet-bar { padding: 8px 16px; }
    .chips {
      flex-wrap: nowrap;
      overflow-x: auto;
      margin: 0 -16px;
      padding: 2px 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
      mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; }
    .bar-row { margin-top: 6px; }
    .diet-bar.stuck { padding: 5px 16px; }
    .diet-bar.stuck .chips { gap: 6px; }
    .diet-bar.stuck .chip { padding: 5px 9px; gap: 4px; }
    .diet-bar.stuck .chip .count { display: none; }
    .diet-bar.stuck .chip:not([aria-pressed="true"]) .label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .diet-bar.stuck .bar-row { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    li.flash { animation: none; }
    .chip, li[data-course] { transition: none; }
  }
  footer {
    margin-top: 36px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
  @media (min-width: 860px) {
    .wrap { max-width: 1180px; }
    .restaurants-grid { grid-template-columns: 1fr 1fr; gap: 8px 24px; }
  }
  @media (max-width: 480px) {
    h1 { font-size: 1.35rem; }
    h2 { font-size: 1.05rem; padding: 10px 12px; }
    li { font-size: 0.95rem; padding: 9px 12px; }
  }
</style>
</head>
<body>
  <div class="wrap">
{{BODY}}
    <footer>Generated automatically on weekday mornings. Diet tags are guessed from the menu text and
      diet codes (VE, G, …) — always check allergies with the restaurant.</footer>
  </div>
<script>
(function () {
  "use strict";
  var FILTERS = [
    { id: "all", icon: "🍽️", label: "All" },
    { id: "vegan", icon: "🌱", label: "Vegan" },
    { id: "veg", icon: "🥬", label: "Vegetarian" },
    { id: "meat", icon: "🥩", label: "Meat lover" },
    { id: "fish", icon: "🐟", label: "Fish & seafood" },
    { id: "gf", icon: "🌾", label: "Gluten-free" },
    { id: "soup", icon: "🍲", label: "Soup" },
    { id: "spicy", icon: "🌶️", label: "Spicy" }
  ];
  var SORTS = [
    { id: "rec", label: "⭐ Recommended" },
    { id: "original", label: "Original order" },
    { id: "cheap", label: "Cheapest first" }
  ];
  var STORE_KEY = "daily-menu-filter";

  var grid = document.querySelector(".restaurants-grid");
  if (!grid) return;

  // ---- Read the dish data written by fetch_menus.py --------------------------
  var restaurants = Array.prototype.map.call(grid.querySelectorAll(".restaurant-card"), function (card) {
    var r = { card: card, order: Number(card.dataset.order), name: card.dataset.restaurant || "" };
    r.dishes = Array.prototype.filter.call(card.querySelectorAll("li[data-course]"), function (li) {
      return li.dataset.course !== "none";
    }).map(function (li) {
      return {
        li: li,
        r: r,
        tags: (li.dataset.tags || "").split(" ").filter(Boolean),
        main: li.dataset.course === "main",
        price: li.dataset.price ? Number(li.dataset.price) : null,
        heat: Number(li.dataset.heat || 0),
        name: li.dataset.name || li.textContent.trim()
      };
    });
    r.available = r.dishes.length > 0;
    var h2 = card.querySelector("h2");
    r.note = document.createElement("span");
    r.note.className = "match-note";
    r.note.hidden = true;
    if (h2) h2.appendChild(r.note);
    return r;
  });
  var allDishes = [].concat.apply([], restaurants.map(function (r) { return r.dishes; }));

  function matches(d, f) { return f === "all" || d.tags.indexOf(f) !== -1; }

  // ---- Recommendation scoring -----------------------------------------------
  // A matching main course is worth 10; sides/desserts much less. Small nudges
  // for lunch-friendly prices, red meat (meat lovers) and chili count (spicy).
  function dishScore(d, f) {
    if (!matches(d, f)) return null;
    var s = d.main ? 10 : 3;
    if (d.main && d.price !== null) s += Math.max(-2, Math.min(2, (14 - d.price) * 0.5));
    if (f === "meat" && d.tags.indexOf("redmeat") !== -1) s += 2;
    if (f === "spicy") s += d.heat;
    if (d.tags.indexOf("basic") !== -1) s -= 3;  // a salad bar is rarely the highlight
    return s;
  }

  function restaurantScore(r, f) {
    if (!r.available) return -1;
    if (f === "all") {
      // Variety: how many kinds of main course (veg / meat / fish / soup) are on offer.
      var kinds = ["veg", "meat", "fish", "soup"].filter(function (k) {
        return r.dishes.some(function (d) { return d.main && d.tags.indexOf(k) !== -1; });
      }).length;
      var mains = r.dishes.filter(function (d) { return d.main; }).length;
      return kinds * 4 + Math.min(mains, 6) + avgPriceBonus(r);
    }
    var scores = r.dishes.map(function (d) { return dishScore(d, f); })
      .filter(function (s) { return s !== null; })
      .sort(function (a, b) { return b - a; });
    // Best dish counts fully, then diminishing returns for more choice.
    return (scores[0] || 0) + 0.5 * (scores[1] || 0) + 0.25 * (scores[2] || 0);
  }

  function avgPriceBonus(r) {
    var prices = r.dishes.filter(function (d) { return d.main && d.price !== null && d.price < 25; })
      .map(function (d) { return d.price; });
    if (!prices.length) return 0;
    var avg = prices.reduce(function (a, b) { return a + b; }, 0) / prices.length;
    return Math.max(-2, Math.min(2, (14 - avg) * 0.5));
  }

  function cheapest(r, f) {
    var prices = r.dishes.filter(function (d) { return d.main && d.price !== null && matches(d, f); })
      .map(function (d) { return d.price; });
    return prices.length ? Math.min.apply(null, prices) : Infinity;
  }

  function bestDish(dishes, f) {
    var best = null, bestScore = -Infinity;
    dishes.forEach(function (d) {
      var s = dishScore(d, f);
      if (s !== null && s > bestScore) { best = d; bestScore = s; }
    });
    return best;
  }

  // ---- Build the toolbar ----------------------------------------------------
  var bar = document.createElement("div");
  bar.className = "diet-bar";
  var chipsEl = document.createElement("div");
  chipsEl.className = "chips";
  chipsEl.setAttribute("role", "group");
  chipsEl.setAttribute("aria-label", "Filter dishes");
  var chipEls = {};
  FILTERS.forEach(function (f) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.dataset.filter = f.id;
    var count = allDishes.filter(function (d) { return matches(d, f.id); }).length;
    b.innerHTML = "<span aria-hidden=\"true\"></span><span class=\"label\"></span>";
    b.firstChild.textContent = f.icon;
    b.children[1].textContent = f.label;
    b.title = f.label;
    if (f.id !== "all") {
      var c = document.createElement("span");
      c.className = "count";
      c.textContent = count;
      c.setAttribute("aria-label", count + " dishes");
      b.appendChild(c);
      if (!count) b.classList.add("empty");
    }
    b.addEventListener("click", function () { state.filter = f.id; update(true); });
    chipsEl.appendChild(b);
    chipEls[f.id] = b;
  });
  bar.appendChild(chipsEl);

  var row = document.createElement("div");
  row.className = "bar-row";
  var status = document.createElement("span");
  status.setAttribute("aria-live", "polite");
  var sortLabel = document.createElement("label");
  sortLabel.className = "sort";
  sortLabel.textContent = "Sort:";
  var select = document.createElement("select");
  SORTS.forEach(function (s) {
    var o = document.createElement("option");
    o.value = s.id;
    o.textContent = s.label;
    select.appendChild(o);
  });
  select.addEventListener("change", function () { state.sort = select.value; update(true); });
  sortLabel.appendChild(select);
  row.appendChild(status);
  row.appendChild(sortLabel);
  bar.appendChild(row);

  var picks = document.createElement("section");
  picks.className = "picks";
  picks.setAttribute("aria-label", "Today's picks");

  grid.parentNode.insertBefore(bar, grid);
  grid.parentNode.insertBefore(picks, grid);

  var divider = document.createElement("div");
  divider.className = "grid-divider";

  // Shadow on the sticky bar once it is stuck to the top (on phones it also
  // shrinks). A spacer after the bar makes up the height it loses, so the page
  // layout doesn't move — otherwise scroll anchoring nudges the page back up,
  // un-sticks the bar and it flips between the two sizes while scrolling slowly.
  if ("IntersectionObserver" in window) {
    var sentinel = document.createElement("div");
    var spacer = document.createElement("div");
    spacer.setAttribute("aria-hidden", "true");
    bar.parentNode.insertBefore(sentinel, bar);
    bar.parentNode.insertBefore(spacer, bar.nextSibling);
    new IntersectionObserver(function (entries) {
      var stuck = !entries[0].isIntersecting;
      if (stuck === bar.classList.contains("stuck")) return;
      var before = bar.offsetHeight;
      bar.classList.toggle("stuck", stuck);
      spacer.style.height = stuck ? Math.max(0, before - bar.offsetHeight) + "px" : "";
      revealActiveChip();
    }).observe(sentinel);
  }

  // Keep the selected chip visible in the swipeable chip row (phone layout).
  function revealActiveChip() {
    var chip = chipEls[state.filter];
    if (!chip || chipsEl.scrollWidth <= chipsEl.clientWidth) return;
    var left = chip.offsetLeft - chipsEl.offsetLeft;
    var right = left + chip.offsetWidth;
    if (left < chipsEl.scrollLeft + 16) chipsEl.scrollLeft = left - 16;
    else if (right > chipsEl.scrollLeft + chipsEl.clientWidth - 28) {
      chipsEl.scrollLeft = right - chipsEl.clientWidth + 28;
    }
  }

  // ---- State (URL hash > saved choice > default) ----------------------------
  var state = { filter: "all", sort: "rec" };
  var validFilter = function (id) { return FILTERS.some(function (f) { return f.id === id; }); };
  var validSort = function (id) { return SORTS.some(function (s) { return s.id === id; }); };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    if (validFilter(saved.filter)) state.filter = saved.filter;
    if (validSort(saved.sort)) state.sort = saved.sort;
  } catch (e) { /* storage unavailable: use defaults */ }
  var fromHash = decodeURIComponent(location.hash.slice(1));
  if (validFilter(fromHash)) state.filter = fromHash;

  // ---- Render ---------------------------------------------------------------
  function update(userAction) {
    var f = state.filter;
    var filterInfo = FILTERS.filter(function (x) { return x.id === f; })[0];
    select.value = state.sort;
    Object.keys(chipEls).forEach(function (id) {
      chipEls[id].setAttribute("aria-pressed", String(id === f));
    });

    // Fade dishes that don't match, star the best dish per restaurant.
    var matchCount = 0;
    restaurants.forEach(function (r) {
      var n = 0;
      r.dishes.forEach(function (d) {
        var m = matches(d, f);
        if (m) n++;
        d.li.classList.toggle("dimmed", !m);
        d.li.classList.remove("pick");
      });
      r.matches = n;
      matchCount += n;
      r.score = restaurantScore(r, f);
      if (f !== "all") {
        var best = bestDish(r.dishes, f);
        if (best) best.li.classList.add("pick");
      }
      r.card.querySelectorAll("li.category-item").forEach(function (cat) {
        var leaves = cat.querySelectorAll("li[data-course]");
        var allDim = leaves.length > 0 && Array.prototype.every.call(leaves, function (li) {
          return li.classList.contains("dimmed");
        });
        cat.classList.toggle("dimmed", allDim);
      });
      var hasMatch = f === "all" ? r.available : n > 0;
      r.card.classList.toggle("no-match", !hasMatch);
      r.note.hidden = f === "all" || n === 0;
      r.note.textContent = n === 1 ? "1 match" : n + " matches";
    });

    // Order: matching restaurants first (sorted), then the rest under a divider.
    var cmp = {
      rec: function (a, b) { return b.score - a.score || a.order - b.order; },
      original: function (a, b) { return a.order - b.order; },
      cheap: function (a, b) {
        return cheapest(a, f) - cheapest(b, f) || b.score - a.score || a.order - b.order;
      }
    }[state.sort];
    var hit = restaurants.filter(function (r) { return !r.card.classList.contains("no-match"); }).sort(cmp);
    var miss = restaurants.filter(function (r) { return r.card.classList.contains("no-match"); })
      .sort(function (a, b) { return Number(b.available) - Number(a.available) || a.order - b.order; });
    hit.forEach(function (r) { grid.appendChild(r.card); });
    if (miss.length) {
      divider.textContent = f === "all" ? "Menu not available today" : "No " + filterInfo.label.toLowerCase() + " match today";
      grid.appendChild(divider);
      miss.forEach(function (r) { grid.appendChild(r.card); });
    } else if (divider.parentNode) {
      divider.parentNode.removeChild(divider);
    }

    status.textContent = f === "all"
      ? allDishes.length + " dishes at " + restaurants.filter(function (r) { return r.available; }).length + " restaurants"
      : matchCount + (matchCount === 1 ? " dish" : " dishes") + " at " + hit.length +
        (hit.length === 1 ? " restaurant" : " restaurants");

    renderPicks(f, filterInfo);
    revealActiveChip();

    if (userAction) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
      var hash = f === "all" ? location.pathname + location.search : "#" + f;
      history.replaceState(null, "", hash);
    }
  }

  function renderPicks(f, filterInfo) {
    var list = [];
    if (f === "all") {
      // One highlight for each kind of eater, from different restaurants when possible.
      var used = [];
      [["veg", "🥬 Veggie"], ["meat", "🥩 Meat"], ["fish", "🐟 Fish"]].forEach(function (k) {
        var mains = allDishes.filter(function (x) { return x.main; });
        var fresh = mains.filter(function (x) { return used.indexOf(x.r) === -1; });
        var d = bestDish(fresh, k[0]) || bestDish(mains, k[0]);
        if (d) { list.push({ d: d, badge: k[1] }); used.push(d.r); }
      });
    } else {
      // Top 3 matching dishes, at most one per restaurant.
      var seen = [];
      allDishes.map(function (d) { return { d: d, s: dishScore(d, f) }; })
        .filter(function (x) { return x.s !== null; })
        .sort(function (a, b) { return b.s - a.s || a.d.r.order - b.d.r.order; })
        .forEach(function (x) {
          if (list.length < 3 && seen.indexOf(x.d.r) === -1) {
            seen.push(x.d.r);
            list.push({ d: x.d, badge: ["🥇", "🥈", "🥉"][list.length] });
          }
        });
    }
    picks.innerHTML = "";
    picks.hidden = list.length === 0;
    if (!list.length) return;
    var h = document.createElement("h3");
    h.textContent = f === "all" ? "⭐ Today's picks" : "⭐ Top " + filterInfo.label.toLowerCase() + " picks";
    var ol = document.createElement("ol");
    list.forEach(function (p) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pick-btn";
      [["badge", p.badge], ["what", p.d.name], ["where", p.d.r.name + (p.d.price !== null ? " · " + p.d.price.toFixed(2).replace(".", ",") + " €" : "")]]
        .forEach(function (part) {
          var s = document.createElement("span");
          s.className = part[0];
          s.textContent = part[1];
          btn.appendChild(s);
        });
      btn.addEventListener("click", function () { jumpTo(p.d.li); });
      li.appendChild(btn);
      ol.appendChild(li);
    });
    picks.appendChild(h);
    picks.appendChild(ol);
  }

  function jumpTo(li) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var y = li.getBoundingClientRect().top + window.pageYOffset - bar.offsetHeight - 16;
    window.scrollTo({ top: y, behavior: reduce ? "auto" : "smooth" });
    li.classList.remove("flash");
    void li.offsetWidth;
    li.classList.add("flash");
  }

  window.addEventListener("hashchange", function () {
    var id = decodeURIComponent(location.hash.slice(1));
    if (validFilter(id) && id !== state.filter) { state.filter = id; update(false); }
  });

  update(false);
})();
</script>
</body>
</html>
