<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Daily Lunch Menu — Leppävaara, Espoo</title>
<meta name="description" content="Today's lunch menus from restaurants near the office in Leppävaara, Espoo.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --card-bg: #ffffff;
    --text: #1f2328;
    --muted: #5b6470;
    --accent: #c0392b;
    --border: #e7e3da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c;
      --card-bg: #1d2226;
      --text: #eef1f3;
      --muted: #a3adb5;
      --accent: #ff8a75;
      --border: #2a2f34;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  h1 {
    font-size: 1.6rem;
    line-height: 1.25;
    margin: 8px 0 4px;
  }
  h1::before { content: none; }
  .wrap > p:first-of-type {
    font-size: 1.05rem;
    color: var(--muted);
    margin-top: 0;
  }
  em {
    color: var(--muted);
    font-style: normal;
    font-size: 0.85rem;
    display: inline-block;
    margin-bottom: 12px;
  }
  .restaurants-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px 20px;
  }
  h2 {
    font-size: 1.15rem;
    margin: 24px 0 10px;
    padding: 12px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: 10px;
  }
  h2 a {
    color: var(--text);
    text-decoration: none;
  }
  h2 a:hover, h2 a:focus { text-decoration: underline; }
  ul {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
  }
  li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-top: none;
    padding: 10px 14px;
    font-size: 0.98rem;
    line-height: 1.45;
  }
  li::before {
    content: "–";
    color: var(--accent);
    font-weight: 700;
    flex-shrink: 0;
  }
  li .dish {
    flex: 1 1 auto;
    min-width: 0;
  }
  li .tags {
    flex-shrink: 0;
    white-space: nowrap;
    padding-left: 8px;
    text-align: right;
  }
  li:first-of-type { border-top: 1px solid var(--border); }
  ul li:last-child { border-radius: 0 0 10px 10px; }
  footer {
    margin-top: 36px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
  @media (min-width: 860px) {
    .wrap { max-width: 1180px; }
    .restaurants-grid { grid-template-columns: 1fr 1fr; gap: 8px 24px; }
  }
  @media (max-width: 480px) {
    h1 { font-size: 1.35rem; }
    h2 { font-size: 1.05rem; padding: 10px 12px; }
    li { font-size: 0.95rem; padding: 9px 12px; }
  }
</style>
</head>
<body>
  <div class="wrap">
{{BODY}}
    <footer>Generated automatically on weekday mornings.</footer>
  </div>
</body>
</html>
